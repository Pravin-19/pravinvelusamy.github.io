<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pravin V Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky profile + nav column on the left, content column on the right, pastel triangles behind, diagonal wipe between pages */
:root{
  --bg:#f3f4fa; --card:#ffffff; --fg:#232a3d; --muted:#5d667c; --line:#e3e6f1;
  --accent:#3f5fd6; --accent-soft:#e6ecff; --accent-ink:#2c47b0;
  --blue:#8aa8f4; --peach:#f9b48c; --ok:#2f9e6e;
  --shadow:0 1px 2px rgba(35,42,61,.04),0 12px 32px -12px rgba(63,95,214,.18);
  --code:#1b2033; --code-fg:#dfe6ff;
  --display:'Space Grotesk','Inter',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0e12; --card:#161822; --fg:#e8ebf5; --muted:#9aa3b8; --line:#262a3b;
  --accent:#8fa8ff; --accent-soft:#1e2540; --accent-ink:#b4c4ff;
  --blue:#4a63b8; --peach:#a8654a; --ok:#5fd0a0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -12px rgba(0,0,0,.6);
  --code:#0a0b10; --code-fg:#cfd8ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0e12; --card:#161822; --fg:#e8ebf5; --muted:#9aa3b8; --line:#262a3b;
  --accent:#8fa8ff; --accent-soft:#1e2540; --accent-ink:#b4c4ff;
  --blue:#4a63b8; --peach:#a8654a; --ok:#5fd0a0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -12px rgba(0,0,0,.6);
  --code:#0a0b10; --code-fg:#cfd8ff; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.7 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer}

/* background triangles */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;display:block;opacity:.6;transform:translateY(calc(var(--sy,0)*var(--k)*1px))}
.bg .t1{left:-90px;top:90px;width:240px;height:280px;background:var(--blue);clip-path:polygon(0 0,100% 50%,0 100%)}
.bg .t2{left:12%;top:-40px;width:300px;height:170px;background:var(--peach);clip-path:polygon(0 0,100% 0,50% 100%);opacity:.5}
.bg .t3{right:6%;top:-30px;width:220px;height:200px;background:var(--blue);clip-path:polygon(50% 0,100% 100%,0 100%);opacity:.35}
.bg .t4{right:-80px;top:46%;width:260px;height:300px;background:var(--peach);clip-path:polygon(100% 0,100% 100%,0 50%);opacity:.4}
.bg .t5{left:4%;bottom:-60px;width:300px;height:200px;background:var(--peach);clip-path:polygon(0 100%,100% 100%,50% 0);opacity:.35}

.shell{position:relative;z-index:1;max-width:1180px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px 28px;padding-block:28px 48px}
.side{position:sticky;top:24px;align-self:start;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}

/* profile */
.hd{grid-column:1/-1;padding:22px 28px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px 28px;position:relative}
.who{display:flex;align-items:center;gap:18px}
.avail{display:flex;flex-direction:column;gap:10px;margin-left:24px;padding-left:52px;border-left:1px solid var(--line);justify-content:center;align-items:flex-start}
.avail small{font:500 12px/1.4 var(--mono);color:var(--muted)}
.acts{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.acts .btn{padding:12px 18px}
.mailln{background:none;border:0;padding:0;cursor:pointer;text-align:left;display:inline-flex;align-items:center;gap:8px;font:500 13px/1.2 var(--mono);color:var(--muted);transition:color .2s;word-break:break-all}
.mailln:hover{color:var(--accent)}
.mailln .ic{width:16px;height:16px}
.sidectl{padding:12px;display:flex;flex-direction:column;gap:8px}
.ctl{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:transparent;font:600 12px/1 var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase;transition:.2s}
.ctl:hover{color:var(--accent);border-color:var(--accent)}
.ctl .ic{width:16px;height:16px}
.ctl .kbd{margin-left:auto}
.tools{display:none;gap:6px;position:absolute;top:14px;right:14px}
.tbtn{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;color:var(--muted);transition:transform .2s,color .2s}
.tbtn:hover{color:var(--accent);transform:rotate(-8deg) scale(1.06)}
.avatar{width:76px;height:76px;flex:none;aspect-ratio:1;position:relative;perspective:400px}
.avatar::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px dashed var(--accent);opacity:.55;animation:spin 24s linear infinite}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 20%;display:block;transition:transform .15s ease-out;transform-style:preserve-3d;background:var(--accent-soft)}
@keyframes spin{to{transform:rotate(360deg)}}
.hd h2{font-size:1.5rem;white-space:nowrap}
.role{font:600 12px/1.4 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.status{display:inline-flex;align-items:center;gap:8px;font:600 12px/1 var(--mono);color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);padding:7px 11px;border-radius:999px;width:max-content}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}70%,100%{box-shadow:0 0 0 8px transparent}}
.socials{display:flex;gap:8px}
.socials a{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);transition:.2s}
.socials a:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-3px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:12px 18px;border-radius:14px;background:var(--accent);color:var(--card);font:600 13px/1 var(--mono);letter-spacing:.04em;border:0;transition:transform .2s,box-shadow .25s,background-color .25s,color .25s,border-color .25s;will-change:transform}
.btn:hover{box-shadow:0 10px 24px -8px var(--accent)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.ghost:hover{background:var(--accent);color:var(--card);border-color:var(--accent);box-shadow:0 10px 24px -8px var(--accent)}
.btn .ic{width:18px;height:18px;transition:transform .2s}
.btn:hover .ic.go{transform:translateX(4px)}

/* nav */
.nav{padding:12px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:16px;padding:12px 14px;border-radius:12px;font:600 13px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);transition:background .2s,color .2s,transform .2s;white-space:nowrap}
.nav a:hover{color:var(--fg);transform:translateX(4px)}
.nav a:hover .ic{transform:rotate(-10deg) scale(1.12)}
.nav .ic{transition:transform .25s}
.nav a.on{background:var(--accent-soft);color:var(--accent-ink)}

/* page */
main{min-width:0}
.ph{display:flex;flex-direction:column;gap:10px;padding-block:8px 28px}
.eyebrow{font:600 12px/1.4 var(--mono);color:var(--accent);letter-spacing:.06em}
.ph h1{font-size:clamp(2.3rem,5.5vw,3.6rem)}
.dot{color:var(--peach)}
.page{display:flex;flex-direction:column;gap:44px}
.sec{display:flex;flex-direction:column;gap:18px}
.sec>h2{font-size:1.45rem;display:flex;align-items:center;gap:12px}
.sec>h2::before{content:"";width:14px;height:14px;background:var(--peach);clip-path:polygon(0 0,100% 50%,0 100%);flex:none}
.lead{font-size:1.1rem;color:var(--fg);max-width:none}
.muted{color:var(--muted)}
.lnk{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.lnk:hover{text-decoration-thickness:2px}
.prose{display:flex;flex-direction:column;gap:14px}
.prose p{max-width:76ch}
.g{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.pad{padding:24px}
.chip{display:inline-block;font:600 12px/1 var(--mono);padding:7px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);transition:transform .2s}
.chip:hover{transform:translateY(-2px) rotate(-2deg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.label{font:600 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}

.panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:20px;padding:22px 24px}
.panel div{display:flex;flex-direction:column;gap:6px}
.panel b{font:600 1.05rem/1.3 var(--display)}
.stat{padding:22px;display:flex;flex-direction:column;gap:6px;transition:transform .25s,border-color .25s}
.stat:hover{transform:translateY(-4px);border-color:var(--accent)}
.stat strong{font:700 2.7rem/1 var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.area{padding:22px;display:flex;flex-direction:column;gap:12px;transition:transform .25s}
.area:hover{transform:translateY(-4px)}
.area .ic{width:44px;height:44px;padding:10px;border-radius:14px;background:var(--accent-soft);color:var(--accent-ink);stroke-width:1.6;transition:transform .35s}
.area:hover .ic{transform:rotate(-12deg) scale(1.08)}
.area h3{font-size:1.15rem}
.area p{color:var(--muted);font-size:.95rem}

.mq{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);display:flex;flex-direction:column;gap:12px}
.mq-track{display:flex;gap:12px;width:max-content;animation:mq 46s linear infinite}
.mq:nth-child(2) .mq-track{animation-direction:reverse;animation-duration:52s}
.mq:hover .mq-track{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.mq .chip{background:var(--card);border:1px solid var(--line);color:var(--fg);padding:10px 14px;font-size:13px}

/* resume + journey timeline */
.tl{position:relative;padding-left:34px;display:flex;flex-direction:column;gap:20px}
.tl::before,.tl::after{content:"";position:absolute;left:9px;top:8px;width:2px;border-radius:2px}
.tl::before{bottom:8px;background:var(--line)}
.tl::after{height:calc(var(--p,0)*(100% - 16px));background:var(--accent)}
.tli{position:relative;padding:22px 24px;display:flex;flex-direction:column;gap:10px}
.tli::before{content:"";position:absolute;left:-34px;top:26px;width:20px;height:20px;border-radius:50%;background:var(--card);border:2px solid var(--line);transition:.4s .15s}
.tli.in::before{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.tli h3{font-size:1.2rem}
.when{font:600 12px/1.3 var(--mono);color:var(--accent);letter-spacing:.04em}
.tli ul,.ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;color:var(--muted);font-size:.96rem}
.skillgrp{padding:20px;display:flex;flex-direction:column;gap:12px}
.skillgrp .chip{background:var(--bg);color:var(--fg);border:1px solid var(--line);font-weight:500}
.cred{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line)}
.cred:first-of-type{border-top:0}
.cred a{color:var(--accent);font:600 12px/1 var(--mono);display:inline-flex;gap:6px;align-items:center}
.cred .ic{width:16px;height:16px}

/* portfolio */
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:999px;font:600 12px/1 var(--mono);letter-spacing:.05em;color:var(--muted);transition:.2s}
.filters button:hover{color:var(--fg);transform:translateY(-2px)}
.filters button.on{background:var(--accent);border-color:var(--accent);color:var(--card)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.pcard{position:relative;display:flex;flex-direction:column;overflow:hidden;transition:transform .3s,box-shadow .3s}
.pcard:hover{transform:translateY(-6px)}
.thumb{height:140px;position:relative;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,var(--t1),var(--t2))}
.thumb::before,.thumb::after{content:"";position:absolute;background:rgba(255,255,255,.35);transition:transform .5s}
.thumb::before{width:120px;height:120px;right:-20px;top:-30px;clip-path:polygon(0 0,100% 0,100% 100%)}
.thumb::after{width:90px;height:90px;left:-10px;bottom:-24px;clip-path:polygon(0 100%,100% 100%,0 0)}
.pcard:hover .thumb::before{transform:translate(-14px,10px) scale(1.2)}
.pcard:hover .thumb::after{transform:translate(14px,-10px) scale(1.2)}
.thumb .ic{width:56px;height:56px;color:#232a3d;stroke-width:1.4;position:relative;z-index:1;transition:transform .35s}
.pcard:hover .thumb .ic{transform:scale(1.14) rotate(-6deg)}
.pbody{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}
.pbody h3{font-size:1.12rem}
.pbody p{color:var(--muted);font-size:.93rem;flex:1}
.pbody .more{font:600 12px/1 var(--mono);color:var(--accent);display:inline-flex;align-items:center;gap:6px}
.more::after{content:"";position:absolute;inset:0}
.pfoot{display:flex;align-items:center;gap:30px;flex-wrap:wrap}
.pfoot .gh{position:relative;z-index:2;display:inline-flex;align-items:center;gap:8px;font:500 13px/1 var(--body);color:var(--muted);transition:color .2s}
.pfoot .gh:hover{color:var(--accent)}
.pfoot .gh .ic{width:16px;height:16px}
.pbody .more .ic{width:16px;height:16px;transition:transform .2s}
.pcard:hover .more .ic{transform:translateX(5px)}
.pcard.pop{animation:pop .45s both}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}}
.back{display:inline-flex;align-items:center;gap:8px;font:600 12px/1 var(--mono);color:var(--muted);width:max-content;transition:.2s}
.back:hover{color:var(--accent);transform:translateX(-4px)}
.back .ic{width:16px;height:16px}
.hero-thumb{height:170px;border-radius:20px}
.pn{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.pn a{padding:18px 20px;display:flex;flex-direction:column;gap:6px;transition:transform .25s,border-color .25s}
.pn a:hover{transform:translateY(-3px);border-color:var(--accent)}
.pn a b{font:600 1.02rem/1.3 var(--display)}
.pn a.next{text-align:right}

/* blog */
.post{padding:24px;display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:20px;align-items:start;transition:transform .25s,border-color .25s}
.post:hover{transform:translateX(6px);border-color:var(--accent)}
.post time{font:600 12px/1.5 var(--mono);color:var(--muted)}
.post h3{font-size:1.25rem;margin-bottom:6px}
.post p{color:var(--muted);font-size:.95rem;margin-bottom:12px}
.post .ic{width:22px;height:22px;color:var(--accent);transition:transform .25s}
.post:hover .ic{transform:translateX(5px)}
.article{max-width:82ch;display:flex;flex-direction:column;gap:18px}
.article h2{font-size:1.4rem;margin-top:14px}
.article ul{padding-left:20px;display:flex;flex-direction:column;gap:8px}
.article code{font:500 .88em var(--mono);background:var(--accent-soft);color:var(--accent-ink);padding:2px 6px;border-radius:6px}
.article pre{margin:0;background:var(--code);color:var(--code-fg);padding:18px 20px;border-radius:16px;overflow-x:auto;font:500 13px/1.7 var(--mono)}
.article pre code{background:none;color:inherit;padding:0;font-size:inherit}
.meta{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font:600 12px/1 var(--mono);color:var(--muted)}
.meta span{display:inline-flex;gap:6px;align-items:center}
.meta .ic{width:15px;height:15px}

/* contact */
.big-mail{font:700 clamp(1.3rem,4.2vw,2.4rem)/1.2 var(--display);word-break:break-all;display:inline-block;background:linear-gradient(var(--peach),var(--peach)) 0 100%/100% 6px no-repeat;transition:background-size .3s;padding-bottom:2px}
.big-mail:hover{background-size:100% 100%}
form.card{padding:24px;display:flex;flex-direction:column;gap:16px}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font:600 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.f input,.f textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;transition:border-color .2s,box-shadow .2s}
.f input:focus,.f textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.f textarea{min-height:130px;resize:vertical}
.info{display:flex;flex-direction:column;gap:14px;padding:24px}
.info div{display:flex;gap:12px;align-items:flex-start}
.info .ic{color:var(--accent);margin-top:2px}
.info b{display:block;font:600 .98rem/1.3 var(--display)}
.info span{color:var(--muted);font-size:.92rem}

footer{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:center;padding-top:28px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem;margin-top:12px}
footer nav{display:flex;gap:18px;flex-wrap:wrap;font:600 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em}
footer nav a:hover{color:var(--accent)}

/* delight + motion */
.prog{position:fixed;left:0;top:env(safe-area-inset-top,0px);height:3px;width:100%;transform-origin:0 50%;transform:scaleX(var(--sp,0));background:linear-gradient(90deg,var(--blue),var(--peach));z-index:90}
.js .rv:not(.in){opacity:0;transform:translateY(22px)}
.rv{transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.page-in>*{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.wipe i{position:fixed;inset:0;z-index:100;pointer-events:none;transition:clip-path .5s cubic-bezier(.7,0,.25,1);clip-path:polygon(-80% 0,-40% 0,-70% 100%,-110% 100%)}
.wipe .w1{background:var(--accent)}
.wipe .w2{background:var(--peach);z-index:101;transition-delay:.09s}
.wipe i[data-s="cover"]{clip-path:polygon(-10% 0,140% 0,110% 100%,-40% 100%)}
.wipe i[data-s="exit"]{clip-path:polygon(140% 0,180% 0,150% 100%,110% 100%)}
.wipe i[data-s="idle"]{transition:none;clip-path:polygon(-80% 0,-40% 0,-70% 100%,-110% 100%)}
.top{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--accent);opacity:0;transform:translateY(16px) scale(.8);pointer-events:none;transition:.3s}
.top.show{opacity:1;transform:none;pointer-events:auto}
.top:hover{transform:translateY(-4px)}
.top .ic{transform:rotate(-90deg)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:14px;font:600 13px/1.3 var(--mono);opacity:0;pointer-events:none;transition:.35s;z-index:120;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
canvas.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:110}
.pal{position:fixed;inset:0;z-index:130;background:rgba(13,14,18,.5);display:grid;place-items:start center;padding:12vh 16px 16px;backdrop-filter:blur(4px)}
.pal-box{width:min(560px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;animation:rise .25s both}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--fg);padding:18px 20px;font:500 15px var(--mono);outline:none}
.pal ul{list-style:none;margin:0;padding:8px;max-height:50vh;overflow:auto}
.pal li{padding:11px 12px;border-radius:10px;display:flex;justify-content:space-between;gap:12px;cursor:pointer;font-size:.95rem}
.pal li small{font:600 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pal li.on{background:var(--accent-soft);color:var(--accent-ink)}
.kbd{font:600 11px/1 var(--mono);padding:3px 6px;border:1px solid var(--line);border-radius:6px;color:var(--muted)}

/* tablet (700-960px): keep the two-column layout, just tighter */
@media (min-width:700px) and (max-width:960px){
  .shell{grid-template-columns:200px minmax(0,1fr);gap:20px;padding-block:20px 40px}
  .hd{grid-template-columns:minmax(0,1fr) auto;padding:18px 22px;gap:14px 20px}
  .who{grid-column:1;grid-row:1;gap:14px}
  .avatar{width:64px;height:64px}
  .hd h2{font-size:1.35rem}
  .avail{grid-column:1;grid-row:2;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-left:0;padding-left:0;border-left:0;border-top:1px solid var(--line);padding-top:14px}
  .acts{grid-column:2;grid-row:1/3;align-self:center}
  .mailln{font-size:12px}
  .nav a{padding-inline:12px}
}
/* mobile (<=699px): stacked layout, unchanged */
@media (max-width:699px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px;padding-block:16px 40px}
  .side{display:contents}
  .hd{order:1;grid-template-columns:minmax(0,1fr);padding:20px;gap:16px}
  .who{padding-right:88px}
  .avail{margin-left:0;padding-left:0;border-left:0;border-top:1px solid var(--line);padding-top:16px}
  .acts{align-items:flex-start}
  .tools{display:flex}
  .nav{order:2;flex-direction:row;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:30;padding:6px;border-radius:16px;gap:2px}
  .nav a{flex:1 1 0;min-width:0;flex-direction:column;justify-content:center;gap:6px;padding:10px 2px;font-size:clamp(7.5px,2.2vw,10px);letter-spacing:0}
  .nav a:hover{transform:none}
  .sidectl{display:none}
  main{order:3}
  .post{grid-template-columns:minmax(0,1fr);gap:8px}
  .post .ic{display:none}
}
@media (max-width:699px){.nav .ic{width:clamp(15px,4.6vw,20px);height:clamp(15px,4.6vw,20px)}}
@media (max-width:520px){.hd{padding:18px}.hd h2{font-size:1.3rem}.avatar{width:62px;height:62px}.who{gap:14px;padding-right:84px}.role{font-size:11px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .js .rv:not(.in){opacity:1;transform:none}
}

const POSTS=[
{slug:'jenkinsfile-to-github-actions',title:'Moving from Jenkinsfile to GitHub Actions without a big bang',date:'Nov 2026',mins:5,tags:['CI/CD','GitHub Actions','Jenkins'],
 excerpt:'A practical order of work for converting pipelines: map first, run both, then retire Jenkins.',
 body:`<p>Converting a Jenkinsfile line by line gives you a workflow that works and is hard to maintain. A better route is to map concepts first, then translate, then run both systems side by side.</p>
<h2>Map the concepts</h2>
<ul><li><code>stage</code> becomes a <code>job</code>, or a step group inside one job when stages share a workspace.</li><li><code>agent</code> labels become <code>runs-on</code> runners.</li><li><code>parallel</code> blocks become jobs without <code>needs</code>, or a matrix.</li><li>Shared libraries become reusable workflows or composite actions.</li><li>Stored credentials become OIDC roles, so no long-lived AWS keys sit in the repository.</li></ul>
<h2>Start with a small skeleton</h2>
<pre><code>name: build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/deploy
          aws-region: ap-south-1
      - run: make deploy</code></pre>
<h2>Run both for a while</h2>
<p>Keep the Jenkins job as the release gate while the new workflow runs on every pull request. When the two agree for a couple of weeks, switch the gate and archive the Jenkinsfile.</p>
<h2>What usually bites</h2>
<ul><li>Implicit workspace state that Jenkins kept between stages.</li><li>Environment variables defined in the Jenkins UI instead of the repository.</li><li>Notifications. Rebuild them early so failures stay visible.</li></ul>`},
{slug:'terraform-modules-three-environments',title:'Terraform modules that survive three environments',date:'Oct 2026',mins:6,tags:['Terraform','IaC','AWS'],
 excerpt:'Variables, outputs and tfvars files that let one module serve production, staging and development.',
 body:`<p>A module earns its place when two teams can use it without reading its source. That means a small set of inputs, useful outputs and no hidden assumptions about the environment.</p>
<h2>Keep the interface small</h2>
<p>Expose what changes between uses: names, CIDR ranges, sizes, tags. Hard-code what should never change, such as encryption being on. Give every variable a type and a description.</p>
<pre><code>variable "name" {
  type        = string
  description = "Prefix used for resource names"
}

variable "cidr_block" {
  type        = string
  description = "CIDR range for the VPC"
}

output "vpc_id" {
  value = aws_vpc.this.id
}</code></pre>
<h2>One tfvars file per environment</h2>
<p>Keep <code>production.tfvars</code>, <code>staging.tfvars</code> and <code>development.tfvars</code> next to the code, and select a workspace to match. The code stays identical. Only the values differ.</p>
<pre><code>terraform workspace select staging
terraform plan -var-file=staging.tfvars</code></pre>
<h2>Version the module</h2>
<p>Publish modules from their own repository and pin consumers to a tag. Upgrades then become a reviewed change instead of a surprise on the next plan.</p>
<h2>Checks before merge</h2>
<ul><li><code>terraform fmt -check</code> and <code>terraform validate</code> on every pull request.</li><li>A plan for each environment, posted to the pull request.</li></ul>`},
{slug:'guardrails-for-ai-assistants',title:'Guardrails for AI assistants that touch real systems',date:'Sep 2026',mins:5,tags:['AI','MCP','Kiro'],
 excerpt:'Steering files, hooks and read-only defaults that keep an assistant useful and contained.',
 body:`<p>Connecting an assistant to Jira, GitHub, Jenkins and email makes it useful. It also gives it reach. The fix is to write the limits down where the assistant reads them, and to enforce the important ones outside the model.</p>
<h2>Steering files carry the rules</h2>
<p>Short, specific rule files work better than one long prompt. Useful topics:</p>
<ul><li><strong>Email safety.</strong> Draft freely, send only after explicit confirmation.</li><li><strong>Source access.</strong> Only approved GitHub organizations, read-only by default.</li><li><strong>Honesty.</strong> If the answer is not in the ticket or the docs, say so instead of guessing.</li><li><strong>Tool notes.</strong> How your team uses Jira fields and Confluence spaces.</li></ul>
<h2>Hooks remove repetitive steps</h2>
<p>A hook that looks up the ticket when work starts, searches documentation, or analyses a failed build saves the same three questions every day. Keep hooks narrow and predictable.</p>
<h2>Enforce what matters</h2>
<p>Rules in a prompt are advice. Permissions are enforcement. Use read-only tokens, scoped credentials and confirmation prompts for anything that sends, deletes or deploys.</p>
<h2>Review the trail</h2>
<p>Treat the assistant like a new teammate. Read what it proposed, check the pull request, and tighten the rules when it surprises you.</p>`},
{slug:'aws-waf-v2-first-rules',title:'AWS WAF v2: first rules, logs and alarms',date:'Aug 2026',mins:5,tags:['Security','AWS WAF','CloudWatch'],
 excerpt:'How web ACLs, rule groups and IP sets fit together, and how to see what they block.',
 body:`<p>AWS WAF v2 is easier once you see the three layers: a web ACL attached to a resource, rules inside it, and reusable pieces such as IP sets and rule groups.</p>
<h2>The pieces</h2>
<ul><li><strong>Web ACL.</strong> The container. It attaches to an Application Load Balancer, API Gateway stage or CloudFront distribution and sets a default action.</li><li><strong>Rule groups.</strong> Reusable sets of rules, managed by AWS or written by you.</li><li><strong>IP sets.</strong> Lists of addresses for allow and deny rules.</li></ul>
<h2>Roll out in count mode</h2>
<p>New rules can block real users. Set them to <code>count</code> first, watch what they would have blocked, then switch to <code>block</code>.</p>
<h2>Turn on logging</h2>
<p>Send WAF logs to CloudWatch Logs. Without them you cannot tell a good rule from a noisy one.</p>
<h2>Alarm on what matters</h2>
<p>Create CloudWatch alarms on blocked request counts and notify through SNS. A sudden jump deserves a person looking at it.</p>
<h2>Keep it in code</h2>
<p>Define web ACLs, rule groups and IP sets in Terraform so every change is reviewed and repeatable.</p>`}
];

/* ---------- routing + transitions ---------- */
const main=$('#main');let shown=null,busy=false;
function route(h){
  if(h.startsWith('work-')){const x=pages.work(h.slice(5));if(x)return{html:x,nav:'portfolio'}}
  else if(h.startsWith('post-')){const x=pages.post(h.slice(5));if(x)return{html:x,nav:'blog'}}
  else if(pages[h]&&!['work','post'].includes(h))return{html:pages[h](),nav:h};
  return{html:pages.about(),nav:'about'};
}
function swap(h){
  const r=route(h);main.innerHTML=r.html;
  $$('#nav a').forEach(a=>{const on=a.dataset.nav===r.nav;a.classList.toggle('on',on);on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});
  scrollTo({top:0,behavior:'instant'});shown=h;
  const pg=$('.page',main);pg&&pg.classList.add('page-in');
  mount();
}
const W=$$('.wipe i');
function nav(first){
  const h=location.hash.replace('#','')||'about';
  if(first||reduce){swap(h);return}
  if(busy||h===shown)return;busy=true;
  W.forEach(w=>w.dataset.s='cover');
  setTimeout(()=>{swap(h);W.forEach(w=>w.dataset.s='exit');
    setTimeout(()=>{W.forEach(w=>w.dataset.s='idle');busy=false;if((location.hash.replace('#','')||'about')!==shown)nav()},700)},620);
}
addEventListener('hashchange',()=>nav());

/* ---------- per-page behaviours ---------- */
let io,typeId=0;
function mount(){
  io&&io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);if(e.target.dataset.countDone===undefined)$$('[data-count]',e.target).forEach(countUp)}}),{threshold:.12,rootMargin:'0px 0px -5% 0px'});
  $$('.rv',main).forEach(el=>io.observe(el));
  $$('[data-count]',main).forEach(el=>{el.dataset.final=el.textContent;el.textContent='0'+(el.dataset.suffix||'')});
  $$('.tw',main).forEach(typer);
  setTimeout(()=>$$('.rv:not(.in)',main).forEach(el=>{const r=el.getBoundingClientRect();if(r.top<innerHeight&&r.bottom>0)el.classList.add('in')}),1200);
  onScroll();
}
function countUp(el){
  const n=+el.dataset.count,s=el.dataset.suffix||'';if(reduce){el.textContent=n+s;return}
  const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/1100),v=Math.round(n*(1-Math.pow(1-k,3)));el.textContent=v+s;if(k<1)requestAnimationFrame(f);else el.textContent=el.dataset.final})(t0);
}
function typer(el){
  const w=JSON.parse(el.dataset.words);if(reduce){el.textContent=w[0];return}
  const id=++typeId;let i=0,j=w[0].length,del=true;
  (function tick(){if(id!==typeId||!el.isConnected)return;const s=w[i];j+=del?-1:1;el.textContent=s.slice(0,j);let t=del?35:70;
    if(!del&&j===s.length){del=true;t=1600}else if(del&&j===0){del=false;i=(i+1)%w.length;t=250}
    setTimeout(tick,t)})();
  el.textContent=w[0];
}

/* filters, copy, form via delegation */
document.addEventListener('click',e=>{
  const f=e.target.closest('[data-f]');
  if(f){$$('#filters button').forEach(b=>b.classList.toggle('on',b===f));
    $$('#pgrid .pcard').forEach(c=>{const show=f.dataset.f==='All'||c.dataset.cat===f.dataset.f;c.hidden=!show;if(show){c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop')}})}
  const c=e.target.closest('[data-copy]');
  if(c){const t=c.dataset.copy,r=c.getBoundingClientRect();
    const done=()=>{toast('Email address copied');burst(r.left+r.width/2,r.top+r.height/2)};
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(done,()=>{const s=getSelection(),rg=document.createRange(),b=$('.big-mail')||c;if(b){rg.selectNodeContents(b);s.removeAllRanges();s.addRange(rg)}toast('Press Ctrl+C to copy the selected address')})}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='cform')return;e.preventDefault();
  const n=$('#cn').value.trim(),m=$('#cm').value.trim(),em=$('#ce').value.trim();
  if(!m){toast('Add a short message first');$('#cm').focus();return}
  const body=encodeURIComponent(m+'\n\n'+(n?'— '+n:'')+(em?'\n'+em:''));
  const a=document.createElement('a');a.href=`mailto:${EMAIL}?subject=${encodeURIComponent('Hello from your portfolio')}&body=${body}`;a.click();
  toast('Opening your mail app. If it does not open, copy the address.');
});

/* toast */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}

/* confetti triangles */
const cv=$('#fx'),cx=cv.getContext('2d');let ps=[],raf;
function burst(x,y){if(reduce)return;cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;
  const cols=['#8aa8f4','#f9b48c','#8fd3c0','#c3a6f0','#f0c36e'];
  for(let i=0;i<46;i++){const a=Math.random()*Math.PI*2,v=4+Math.random()*7;ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,r:Math.random()*6,vr:(Math.random()-.5)*.4,s:6+Math.random()*8,c:cols[i%5],l:1})}
  cancelAnimationFrame(raf);(function f(){cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
    ps=ps.filter(p=>p.l>0);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.985;p.r+=p.vr;p.l-=.017;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.max(p.l,0);cx.fillStyle=p.c;cx.beginPath();cx.moveTo(0,-p.s);cx.lineTo(p.s,p.s);cx.lineTo(-p.s,p.s);cx.fill();cx.restore()});
    if(ps.length)raf=requestAnimationFrame(f);else cx.clearRect(0,0,innerWidth,innerHeight)})()}

/* scroll: progress bar, parallax, timeline, back-to-top */
let tick=false;
function onScroll(){
  const y=scrollY,h=document.documentElement.scrollHeight-innerHeight;
  document.documentElement.style.setProperty('--sp',h>0?Math.min(1,y/h):0);
  $('#bg').style.setProperty('--sy',y);
  $('#top').classList.toggle('show',y>500);
  $$('.tl',main).forEach(t=>{const r=t.getBoundingClientRect();t.style.setProperty('--p',Math.max(0,Math.min(1,(innerHeight*.65-r.top)/r.height)))});
  tick=false;
}
addEventListener('scroll',()=>{if(!tick){tick=true;requestAnimationFrame(onScroll)}},{passive:true});
$('#top').addEventListener('click',()=>scrollTo({top:0,behavior:reduce?'auto':'smooth'}));

/* magnetic buttons + avatar tilt */
document.addEventListener('pointermove',e=>{
  if(reduce||e.pointerType==='touch')return;
  const m=e.target.closest&&e.target.closest('.mag');
  $$('.mag').forEach(b=>{if(b!==m)b.style.transform=''});
  if(m){const r=m.getBoundingClientRect();m.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.12}px,${(e.clientY-r.top-r.height/2)*.2}px)`}
  const a=$('#avatar img'),ar=$('#avatar').getBoundingClientRect(),dx=(e.clientX-ar.left-ar.width/2)/innerWidth,dy=(e.clientY-ar.top-ar.height/2)/innerHeight;
  a.style.transform=`rotateY(${dx*26}deg) rotateX(${-dy*26}deg)`;
});

/* theme */
const root=document.documentElement;
function dark(){return root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
function themeIcon(){$$('.js-theme use').forEach(u=>u.setAttribute('href',dark()?'#i-sun':'#i-moon'));$$('.tl-lbl').forEach(l=>l.textContent=dark()?'Light':'Dark')}
try{const s=localStorage.getItem('pv-theme');if(s)root.dataset.theme=s}catch(e){}
themeIcon();
$$('.js-theme').forEach(b=>b.addEventListener('click',()=>{const t=dark()?'light':'dark';root.dataset.theme=t;try{localStorage.setItem('pv-theme',t)}catch(e){}themeIcon()}));

/* command palette */
const CMDS=[['About','#about','Page'],['Portfolio','#portfolio','Page'],['Resume','#resume','Page'],['Journey','#journey','Page'],['Blog','#blog','Page'],['Contact','#contact','Page'],...WORKS.map(w=>[w.title,'#work-'+w.slug,'Project']),...POSTS.map(p=>[p.title,'#post-'+p.slug,'Post'])];
let pal=null,sel=0,list=[];
function openPal(){
  if(pal)return;pal=document.createElement('div');pal.className='pal';
  pal.innerHTML=`<div class="pal-box" role="dialog" aria-label="Search the site"><input id="pq" placeholder="Jump to a page, project or post" autocomplete="off"><ul></ul></div>`;
  document.body.appendChild(pal);const q=$('#pq',pal);q.focus();render('');
  q.addEventListener('input',()=>render(q.value));
  pal.addEventListener('click',e=>{if(e.target===pal)closePal();const li=e.target.closest('li');if(li)go(+li.dataset.i)});
  q.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){sel=Math.min(list.length-1,sel+1);hl();e.preventDefault()}else if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);hl();e.preventDefault()}else if(e.key==='Enter'&&list[sel])go(sel)});
}
function render(v){v=v.toLowerCase();list=CMDS.filter(c=>c[0].toLowerCase().includes(v));sel=0;$('ul',pal).innerHTML=list.map((c,i)=>`<li data-i="${i}" class="${i?'':'on'}"><span>${c[0]}</span><small>${c[2]}</small></li>`).join('')||'<li><span class="muted">No matches</span></li>'}
function hl(){$$('li',pal).forEach((l,i)=>l.classList.toggle('on',i===sel));const l=$$('li',pal)[sel];l&&l.scrollIntoView({block:'nearest'})}
function go(i){location.hash=list[i][1];closePal()}
function closePal(){pal&&pal.remove();pal=null}
$$('.js-search').forEach(b=>b.addEventListener('click',openPal));
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();pal?closePal():openPal()}else if(e.key==='Escape')closePal()});

nav(true);
console.log('%cHi, I am Pravin. Say hello: '+EMAIL,'font:600 14px monospace;color:#3f5fd6');
</script>
